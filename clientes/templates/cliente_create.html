{% extends 'base.html' %}

{% block content %}
  <div class="container mt-4">
    <h3 class="display-4">Cadastrar Cliente</h3>

    <div class="card">
      <div class="card-body">
        <form method="post" class="form">
          {% csrf_token %}
          {{ form.as_p }}
          <button type="submit" class="btn btn-primary">Salvar Cliente</button>
        </form>
      </div>
    </div>
    <a href="{% url 'cliente_list' %}" class="btn btn-secondary mt-3">Cancelar e Voltar para a Lista de Clientes</a>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("id_cep").addEventListener("blur", function () {
            let cep = this.value.replace(/\D/g, ''); // Remove caracteres não numéricos

            if (cep.length === 8) { // Confere se o CEP tem 8 dígitos
                fetch(`https://viacep.com.br/ws/${cep}/json/`)
                    .then(response => response.json())
                    .then(data => {
                        if (!data.erro) {
                            document.getElementById("id_endereco").value = data.logradouro;
                            document.getElementById("id_bairro").value = data.bairro;
                            document.getElementById("id_cidade").value = data.localidade;
                            document.getElementById("id_estado").value = data.uf;
                        } else {
                            alert("CEP não encontrado!");
                        }
                    })
                    .catch(error => console.error("Erro ao buscar CEP:", error));
            }
        });
    });
  </script>

{% endblock %}
